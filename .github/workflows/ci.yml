name: CI

on:
  push:
    branches:
    - main
    - develop
    tags:
    - v[0-9]+.[0-9]+.[0-9]+**
  pull_request:
    branches:
    - main
    - develop

env:
  DATA_PORTAL_COMPOSE_PROJECT: test

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Check shell scripts
      uses: ludeeus/action-shellcheck@master
      with:
        ignore_paths: .github/scripts

  test-data-node-e2e:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install aether
      run: .github/scripts/install-aether.sh

    - name: Set up Data Node
      run: .github/scripts/setup-data-node.sh

    - name: Get MII testdata
      working-directory: data-node
      run: ./get-mii-testdata.sh

    - name: Upload testdata
      run: data-node/upload-testdata.sh

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install e2e test dependencies
      run: pip install -r tests/requirements.txt

    - name: Run e2e tests
      # The DUP profile runs get their own runner, see test-dup-pipeline-profiles.
      run: pytest tests/node tests/pipeline --ignore=tests/pipeline/test_dup_pipeline_profiles.py

  test-dup-pipeline-profiles:
    # One pipeline run per DSE profile, 4 in parallel. Separate from test-data-node-e2e,
    # because the data node services grow during the other tests, and in one job GitHub shut
    # the runner down (exit code 143) during these runs.
    runs-on: ubuntu-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install aether
      run: .github/scripts/install-aether.sh

    - name: Set up Data Node
      run: .github/scripts/setup-data-node.sh

    - name: Get MII testdata
      working-directory: data-node
      run: ./get-mii-testdata.sh

    - name: Upload testdata
      run: data-node/upload-testdata.sh

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install e2e test dependencies
      run: pip install -r tests/requirements.txt

    - name: Run DUP pipeline profile tests
      run: pytest tests/pipeline/test_dup_pipeline_profiles.py -rA --basetemp=test-results/tmp

    - name: Upload run summaries
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dup-pipeline-profiles-results
        path: |
          test-results/tmp/*/summary.md
          test-results/tmp/*/coverage.md
          test-results/tmp/*/runs/*/aether.log
        if-no-files-found: ignore

  integration-portal:
    # Playwright 1.60 has no browser builds for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install test dependencies
      run: |
        pip install -r tests/requirements.txt
        python -m playwright install --with-deps chromium

    - name: Set up Data Node (core services)
      env:
        DATA_NODE_PROFILE: core
      run: .github/scripts/setup-data-node.sh

    - name: Get MII testdata
      working-directory: data-node
      run: ./get-mii-testdata.sh

    - name: Upload testdata
      run: data-node/upload-testdata.sh

    - name: Set up Data Portal
      run: .github/scripts/setup-data-portal.sh

    - name: Create portal test user
      run: .github/scripts/create-portal-test-user.sh

    - name: Run integration tests
      run: >
        pytest tests/api tests/ui -m smoke
        --junitxml=test-results/junit.xml
        --output=test-results/playwright
        --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure

    - name: Collect container logs
      if: failure()
      run: .github/scripts/collect-docker-logs.sh test-results/docker-logs

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-portal-results
        path: test-results
        if-no-files-found: ignore
