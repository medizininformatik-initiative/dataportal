name: Re-run timed-out CI

# Re-runs the failed jobs of a CI run once when one of its steps or jobs hit its timeout.
# workflow_run only uses this file from the default branch, so it acts after the merge to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest

    steps:
    - name: Re-run failed jobs if one timed out
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" -q '.jobs[] | select(.conclusion == "failure") | .id'); do
          if gh api "repos/$GH_REPO/check-runs/$job/annotations" -q '.[].message' \
              | grep -qE 'has timed out after|exceeded the maximum execution time'; then
            echo "Job $job timed out, re-running the failed jobs of run $RUN_ID"
            gh run rerun "$RUN_ID" --failed
            exit 0
          fi
        done
        echo "No job timed out, nothing to re-run"
