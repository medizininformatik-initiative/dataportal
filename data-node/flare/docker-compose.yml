services:
  flare:
    image: ghcr.io/medizininformatik-initiative/flare:2.9.0
    ports:
      - ${DATA_NODE_FLARE_PORT:-127.0.0.1:8084}:8080
    env_file:
      - .env
    environment:
      # Workaround for CVE-2026-114938 (Java4Shell). Remove once the image ships a patched JDK.
      JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
    restart: unless-stopped
    extra_hosts:
      - "auth.localhost:host-gateway"
    volumes:
      - ${FLARE_SELF_SIGNED_CA_CERT_PATH:-../auth}:/app/certs:ro
      - type: volume
        source: feas-flare-cache
        target: /app/cache
      - ./mapping.zip:/app/ontology/mapping.zip

volumes:
  feas-flare-cache:
    name: "feas-flare-cache"
