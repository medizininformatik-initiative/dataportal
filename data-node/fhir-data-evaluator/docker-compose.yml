services:
  fhir-data-evaluator:
    image: ghcr.io/medizininformatik-initiative/fhir-data-evaluator:1.3.3
    env_file:
      - ${OVERRIDE_ENV:-.env}
    environment:
      # Workaround for CVE-2026-114938 (Java4Shell). Remove once the image ships a patched JDK.
      JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
    extra_hosts:
      - "auth.localhost:host-gateway"
      - "localhost:host-gateway"
    volumes:
    - "${FDE_INPUT_MEASURE:-./measure/kds-measure.json}:/app/measure.json"
    - "${FDE_OUTPUT_DIR:-./output}:/app/output"
    - ../auth:/app/certs
